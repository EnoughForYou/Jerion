id: DRO-001
title: Sideloaded Package Installer Capability
category: dropper
severity: high
confidence: medium
weight: 75
why: Application was installed from an untrusted source and declares REQUEST_INSTALL_PACKAGES.
false_positive_hint: Alternative open-source app stores (such as F-Droid) legitimately install packages.
remediation:
  - revoke_permission
  - uninstall
conditions:
  is_system: false
  installer: sideload
  required_permissions:
    - android.permission.REQUEST_INSTALL_PACKAGES
