name: CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:
    branches:
      - main

jobs:
  validate-ubuntu:
    name: Validate (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Checks & Build
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Go Vet & Test
        run: |
          go vet ./...
          go test -v $(go list ./... | grep -v /frontend)

  build-windows:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Pinned Wails CLI v2.16.0
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Wails Production Build
        run: |
          wails build
